<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="680" fill="url(#bgGrad)" />

  <!-- Outer Border -->
  <rect x="20" y="20" width="1060" height="640" rx="16" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Title Section -->
  <text x="50" y="65" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">
    HYDROMIND: SYSTEM ARCHITECTURE &amp; DATA PIPELINE
  </text>
  <text x="50" y="92" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">
    Real-Time Decentralized IoT Water Quality Index (WQI) Platform for Leisure Facilities
  </text>

  <!-- =========================================================================
       SECTION 1: EDGE TELEMETRY & HARDWARE (Ashmit)
  ========================================================================= -->
  <rect x="50" y="125" width="280" height="495" rx="12" fill="url(#blueCard)" stroke="#0ea5e9" stroke-width="1.5" />
  <rect x="50" y="125" width="280" height="42" rx="12" fill="#0ea5e9" fill-opacity="0.15" />
  <text x="70" y="152" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">
    1. EDGE HARDWARE &amp; FIRMWARE
  </text>
  <text x="70" y="190" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">
    ESP32-CAM AI-Thinker Module
  </text>

  <!-- DS18B20 Box -->
  <rect x="70" y="210" width="240" height="65" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="85" y="234" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">DS18B20 Temp Probe</text>
  <text x="85" y="255" fill="#64748b" font-family="monospace" font-size="11">OneWire Protocol • GPIO 13</text>

  <!-- ADS1115 & Turbidity Box -->
  <rect x="70" y="290" width="240" height="85" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="85" y="314" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">R-0913 Turbidity + ADS1115</text>
  <text x="85" y="335" fill="#64748b" font-family="monospace" font-size="11">16-Bit I2C ADC (SDA:14, SCL:15)</text>
  <text x="85" y="355" fill="#38bdf8" font-family="monospace" font-size="11">0.5V (Murky) - 3.0V (Clear)</text>

  <!-- OV2640 Camera Box -->
  <rect x="70" y="390" width="240" height="85" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="85" y="414" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">OV2640 Optical Sensor</text>
  <text x="85" y="435" fill="#64748b" font-family="monospace" font-size="11">RGB565 Sampling • Hue Extractor</text>
  <text x="85" y="455" fill="#38bdf8" font-family="monospace" font-size="11">MJPEG Stream Server (:80/stream)</text>

  <!-- Firmware Engine -->
  <rect x="70" y="490" width="240" height="110" rx="8" fill="#0f172a" stroke="#0284c7" stroke-dasharray="4 4" />
  <text x="85" y="515" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Firmware Dispatch Loop</text>
  <text x="85" y="535" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Wi-Fi STA Mode Auto-reconnect</text>
  <text x="85" y="555" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• 5000ms Periodic Telemetry</text>
  <text x="85" y="575" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• JSON Payload Builder</text>

  <!-- Flow Arrow 1 -> 2 -->
  <path d="M 330 380 L 400 380" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-dasharray="6 4" />
  <polygon points="400,375 412,380 400,385" fill="#0ea5e9" />
  <text x="340" y="365" fill="#0ea5e9" font-family="system-ui, sans-serif" font-size="11" font-weight="600">HTTP POST</text>

  <!-- =========================================================================
       SECTION 2: BACKEND & ML CLOUD (Badri & Shaurya)
  ========================================================================= -->
  <rect x="415" y="125" width="310" height="495" rx="12" fill="url(#blueCard)" stroke="#6366f1" stroke-width="1.5" />
  <rect x="415" y="125" width="310" height="42" rx="12" fill="#6366f1" fill-opacity="0.15" />
  <text x="435" y="152" fill="#818cf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700">
    2. BACKEND &amp; ML PIPELINE
  </text>

  <!-- FastAPI Ingestion -->
  <rect x="435" y="185" width="270" height="70" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="450" y="210" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">FastAPI Telemetry Ingest</text>
  <text x="450" y="230" fill="#64748b" font-family="monospace" font-size="11">POST /api/esp &amp; GET /api/data</text>
  <text x="450" y="246" fill="#818cf8" font-family="monospace" font-size="11">Pydantic Payload Validation</text>

  <!-- ML Regression Pipeline -->
  <rect x="435" y="270" width="270" height="150" rx="8" fill="#1e293b" stroke="#4f46e5" />
  <text x="450" y="295" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">RandomForestRegressor Pipeline</text>
  <text x="450" y="318" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">7-D Normalized Feature Vector:</text>
  <text x="450" y="336" fill="#94a3b8" font-family="monospace" font-size="10">[NTU, Temp, DO, Hue, Sat, Val, Clarity]</text>
  <text x="450" y="356" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Estimates WQI Index (0 - 100):</text>
  <rect x="450" y="366" width="75" height="20" rx="4" fill="#10b981" fill-opacity="0.2" />
  <text x="456" y="380" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="700">0-30: Safe</text>
  <rect x="532" y="366" width="85" height="20" rx="4" fill="#f59e0b" fill-opacity="0.2" />
  <text x="538" y="380" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="700">31-60: Caution</text>
  <rect x="624" y="366" width="70" height="20" rx="4" fill="#ef4444" fill-opacity="0.2" />
  <text x="630" y="380" fill="#f87171" font-family="system-ui, sans-serif" font-size="10" font-weight="700">61+: Closed</text>
  <text x="450" y="406" fill="#64748b" font-family="monospace" font-size="10">Model: hydromind_wqi_model.joblib</text>

  <!-- WebSocket & Alert Service -->
  <rect x="435" y="435" width="270" height="85" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="450" y="458" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Real-Time WebSocket Hub</text>
  <text x="450" y="478" fill="#64748b" font-family="monospace" font-size="11">ws://host:3000/ws broadcast</text>
  <text x="450" y="496" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11">Automated Critical Threshold Alerts</text>

  <!-- Time Series Store -->
  <rect x="435" y="530" width="270" height="70" rx="8" fill="#0f172a" stroke="#334155" stroke-dasharray="4 4" />
  <text x="450" y="552" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">In-Memory Ring Buffer Store</text>
  <text x="450" y="572" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">50-point rolling telemetry history</text>
  <text x="450" y="588" fill="#64748b" font-family="monospace" font-size="11">GET /api/telemetry/history</text>

  <!-- Flow Arrow 2 -> 3 -->
  <path d="M 725 380 L 785 380" fill="none" stroke="#6366f1" stroke-width="3" stroke-dasharray="6 4" />
  <polygon points="785,375 797,380 785,385" fill="#6366f1" />
  <text x="735" y="365" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600">WebSocket</text>

  <!-- =========================================================================
       SECTION 3: FRONTEND & GUEST ACCESS (Ganesh)
  ========================================================================= -->
  <rect x="800" y="125" width="250" height="495" rx="12" fill="url(#blueCard)" stroke="#10b981" stroke-width="1.5" />
  <rect x="800" y="125" width="250" height="42" rx="12" fill="#10b981" fill-opacity="0.15" />
  <text x="820" y="152" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700">
    3. USER DASHBOARD
  </text>

  <!-- Gauge Component -->
  <rect x="820" y="185" width="210" height="85" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="835" y="210" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Radial WQI Gauge</text>
  <text x="835" y="230" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Dynamic Risk Tier Badging</text>
  <text x="835" y="250" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Color: Green / Amber / Red</text>

  <!-- Metric Cards -->
  <rect x="820" y="280" width="210" height="85" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="835" y="304" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Multi-Modal Metrics</text>
  <text x="835" y="324" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Temp (°C / °F)</text>
  <text x="835" y="342" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Turbidity (V / NTU) &amp; DO</text>

  <!-- Live Stream Box -->
  <rect x="820" y="375" width="210" height="75" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="835" y="398" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Live Camera Stream</text>
  <text x="835" y="418" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Poolside Visual Proof Feed</text>
  <text x="835" y="434" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">OV2640 MJPEG Stream</text>

  <!-- QR Code Modal -->
  <rect x="820" y="460" width="210" height="80" rx="8" fill="#1e293b" stroke="#059669" />
  <text x="835" y="482" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Poolside QR Code</text>
  <text x="835" y="502" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Decentralized Guest Verification</text>
  <text x="835" y="520" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Scan prior to entering pool</text>

  <!-- View Mode -->
  <rect x="820" y="550" width="210" height="50" rx="8" fill="#0f172a" stroke="#334155" stroke-dasharray="4 4" />
  <text x="835" y="570" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Guest vs. Operator Mode</text>
  <text x="835" y="588" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Role-tailored telemetry views</text>
</svg>
