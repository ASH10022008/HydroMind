<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hydromind</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="feed-box">
        <img id="cameraFeed" src="" alt="Camera stream" />
      </div>

      <div class="metrics">
        <div class="card">
          <div class="label">Temperature</div>
          <div class="value" id="temperature">--</div>
        </div>
        <div class="card">
          <div class="label">Color</div>
          <div class="value" id="color">--</div>
        </div>
        <div class="card">
          <div class="label">Turbidity sensor output</div>
          <div class="value" id="turbidity">--</div>
        </div>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
